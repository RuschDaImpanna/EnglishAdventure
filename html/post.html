<!DOCTYPE html>
<html lang="es">

    <head>

        <meta charset="UTF-8">
        <meta name="author" content="Santiago A. Sánchez">
        <!--a.k.a Rusch Da Impanna-->
    
        <!--CSS-->
        <link rel="stylesheet" href="../css/reset.css">
        <link rel="stylesheet" href="../css/prototypeGame.css">

        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <!--Fonts-->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Quicksand:500,700|Bubblegum+Sans">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,500,1,200&icon_names=close,dehaze,group,home,how_to_vote,key,question_mark" />
        <script src="https://unpkg.com/compromise"></script>

        <link rel="icon" href="../logoArt/womanPurple2.png">
        <title>Post - English Adventure</title>

    </head>

    <body>

        <article class="mainMenu appear">

            <h1>Prototipo Beat The Clock</h1>

            <ul id="levelList" class="menues">

                <li><button disabled>Grado Sexto</button></li>

                <li><button>Grado Séptimo</button></li>

                <li><button disabled>Grado Octavo</button></li>

                <li><button disabled>Grado Noveno</button></li>

            </ul>

            <ul id="difficultyList" class="menues hidden">

                <li><button>Go back</button></li>

                <li><button>Lvl 1: <br>Complete verbs</button></li>

                <li><button>Lvl 2: <br>Complete auxiliars</button></li>

                <li><button>Lvl 3: <br>Invert the phrase</button></li>

            </ul>

        </article>

        <article class="songSelection">

            <button id="backToOpt">Back</button>

            <div class="songsPool"></div>

        </article>

        <article class="game">

            <div class="gameData">

                <button id="goBackBtn">Exit</button>

                <h3 id="hp">HP: ♥♥♥</h3>

                <h3 id="time">Time: 15</h3>

                <h3 id="score">Score: 0</h3>

            </div>

            <video></video>

            <div class="lyricsWrap">

                <div id="lastLyric">...</div>
                <div id="currentLyric">...</div>
                <div id="nextLyric">...</div>

            </div>

        </article>

        <script src="../js/prototypeBTC.js" type="module"></script>

    </body>

</html>
